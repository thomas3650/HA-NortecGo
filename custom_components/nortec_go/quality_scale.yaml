rules:
  # Bronze
  action-setup:
    status: exempt
    comment: "The integration registers no service actions."
  appropriate-polling:
    status: done
    comment: "30 s only while a charge is starting or stopping, bounded while reads fail (10 min after a start, 2 min after a stop or the last good read); 5 min while charging, 60 min otherwise (D29, D31)."
  brands:
    status: done
    comment: "Local brand/ folder (HA >= 2026.3), accepted by HACS; moves to home-assistant/brands for a core submission."
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: "The pynortecgo source repo is private; the rule needs an open repo, tags and a public publishing pipeline. Tracked in the pynortecgo repo (issue #34)."
  docs-actions:
    status: exempt
    comment: "The integration registers no service actions."
  docs-conditions:
    status: exempt
    comment: "The integration provides no conditions."
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: "The integration provides no triggers."
  entity-event-setup:
    status: exempt
    comment: "Entities subscribe to no events; the coordinator owns the timers."
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: "The Charge switch raises translated errors; the Refresh button's press raises nothing when its read fails (#40)."
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: "The integration has no options flow."
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: "The Charge switch, the Current price sensor, the Refresh button and the Last read sensor stay available after a failed read on purpose (turn_off still reaches the charger; the price lists and the last read's time stay visible); the other entities follow the rule."
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: "CI fails below 95% in total; every module is above it."

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: "Cloud only (cloud_polling): the integration reaches the charger only through the Nortec Go account, never on the local network."
  discovery-update-info:
    status: exempt
    comment: "No discovery: the integration reaches the charger only through the cloud account and stores no network address."
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: "Whether the account has a car is fixed at setup; a car added later shows up only after a reload."
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: "Every entity is enabled: Last read and Last seen are the only signs of how old the charger and car data are, and they change only once per read (D29)."
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: todo
    comment: "No icons.json yet; the Charge switch, the Refresh button and the Current price, Charge status and Charge limit sensors have no icon of their own."
  reconfiguration-flow:
    status: todo
    comment: "No reconfigure step; the config flow has only the user and reauth steps."
  repair-issues: done
  stale-devices:
    status: todo
    comment: "A car removed while running keeps its last data until a reload, which removes its device; no async_remove_config_entry_device."

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: "mypy runs strict on the integration and its tests in CI; pynortecgo ships py.typed; NortecGoConfigEntry is used throughout."
