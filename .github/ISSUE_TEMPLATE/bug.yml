name: Bug report
description: Report a problem with the Nortec Go integration.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.3"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: >-
        Optional. Please redact tokens, email addresses and account/charger IDs before pasting.
    validations:
      required: false
