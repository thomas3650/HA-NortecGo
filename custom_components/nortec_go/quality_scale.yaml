rules:
  # Bronze
  action-setup:
    status: exempt
    comment: "The integration registers no service actions."
  appropriate-polling:
    status: done
    comment: "30 s only while a charge is starting or stopping or a stop asked for hasn't gone through (at most 30 minutes per stop, D50), bounded while reads fail (10 min after a start, 2 min after a stop or the last good read); 5 min while charging, 60 min otherwise (D29, D31)."
  brands:
    status: done
    comment: "Local brand/ folder (HA >= 2026.3), accepted by HACS; moves to home-assistant/brands for a core submission."
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: "The pynortecgo source repo is private; the rule needs an open repo, tags and a public publishing pipeline. Tracked in the pynortecgo repo (issue #34)."
  docs-actions:
    status: exempt
    comment: "The integration registers no service actions."
  docs-conditions:
    status: exempt
    comment: "The integration provides no conditions."
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: "The integration provides no triggers."
  entity-event-setup:
    status: exempt
    comment: "Entities subscribe to no events; the coordinator owns the timers."
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: "Turning Charge on and the Refresh button raise translated errors when their action fails. A turn-off that can't stop the charge is tried again and ends in a repair issue (D50); a rejected session and a reload raise translated errors."
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: "The integration has no options flow."
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: "The Charge switch, the Current price sensor, the Refresh button and the Last read sensor stay available after a failed read on purpose (turn_off still reaches the charger; the price lists and the last read's time stay visible); the other entities follow the rule."
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: "CI fails below 95% in total; every module is above it."

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: "Cloud only (cloud_polling): the integration reaches the charger only through the Nortec Go account, never on the local network."
  discovery-update-info:
    status: exempt
    comment: "No discovery: the integration reaches the charger only through the cloud account and stores no network address."
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: "Deliberately not done (D44): car entities are added only at setup, so a car added to the account shows up after a reload."
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: "Every entity is enabled: Last read and Last seen are the only signs of how old the charger and car data are, and they change only once per read (D29)."
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: done
    comment: "icons.json gives an icon to every entity that has no device class or the enum device class, with one per state for Charge status; every other entity shows its device class's icon."
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: todo
    comment: "Deliberately not done while running (D44): a car that goes from the account makes its entities unavailable and raises a repair issue whose fix reloads the entry; the device is removed at setup. No async_remove_config_entry_device."

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: "mypy runs strict on the integration and its tests in CI; pynortecgo ships py.typed; NortecGoConfigEntry is used throughout."
