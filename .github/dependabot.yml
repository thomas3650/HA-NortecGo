version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      uv:
        patterns: ["*"]
    ignore:
      - dependency-name: pynortecgo  # Renovate bumps it, with manifest.json (D51)
  - package-ecosystem: pre-commit
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
